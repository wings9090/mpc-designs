<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تصاميم مقترحة | دائرة العيادات الطبية الشعبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f8;--surface:#fff;--ink:#14181d;--muted:#5a6470;--line:#dde2e8;--accent:#0b5d4e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.7}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:20px}
header{padding-block:3rem 1.5rem}
h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:0;line-height:1.25}
header p{color:var(--muted);max-width:70ch;margin:.8rem 0 0}
.host{display:grid;grid-template-columns:1fr auto;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-block:1.5rem}
.host label{grid-column:1/-1;font-weight:700;font-size:.92rem}
.host input{font:inherit;padding:.65rem .8rem;border:1.5px solid #aab4c0;border-radius:8px;direction:ltr;min-width:0}
.host button{font:inherit;font-weight:700;padding:.65rem 1.2rem;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.host small{grid-column:1/-1;color:var(--muted)}
.warn{color:#9a3412;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;padding-bottom:3rem}
.c{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
.c .sw{display:flex;gap:4px;margin-bottom:.7rem}
.c .sw i{width:26px;height:26px;border-radius:50%;border:1px solid rgb(0 0 0 / .12)}
.c h2{font-size:1.15rem;margin:0}
.c p{color:var(--muted);font-size:.9rem;margin:.3rem 0 .9rem}
.c a.open{display:inline-block;font-weight:700;color:var(--accent);text-decoration:none;border-bottom:2px solid currentColor}
.qr{width:116px;text-align:center}
.qr img,.qr canvas{width:116px!important;height:116px!important;display:block}
.qr span{font-size:.72rem;color:var(--muted);direction:ltr;display:block;margin-top:.3rem;word-break:break-all}
@media print{.host,header p{display:none}.grid{grid-template-columns:1fr 1fr}.c{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>خمسة عشر تصميماً مقترحاً لموقع دائرة العيادات الطبية الشعبية</h1>
  <p>هذه نماذج تصميمية مقترحة وليست الموقع الرسمي للدائرة. المحتوى واحد في كل التصاميم، والاختلاف في الشكل وطريقة العرض. امسح الباركود بالهاتف لفتح التصميم، أو اضغط «فتح التصميم».</p>
</header>
<div class="host">
  <label for="base">رابط الاستضافة الذي تُبنى عليه الباركودات</label>
  <input id="base" type="url">
  <button id="apply">تحديث الباركودات</button>
  <small id="hint"></small>
</div>
<div class="grid" id="grid"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SITES = [
  ['01','الرسمي الهادئ','لغة الخدمات الحكومية الموثوقة. أخضر صحي وتخطيط مباشر.',['#0b5d4e','#eaf2ef','#12211d']],
  ['02','بينتو','بلاطات بأحجام مختلفة على طريقة Apple. أزرق واحد.',['#0066cc','#f5f5f7','#0a1530']],
  ['03','ليلي','واجهة داكنة هادئة بخطوط شعرية ولون نعناعي.',['#3ecf8e','#17181a','#0f1011']],
  ['04','الصحيفة','تصميم تحريري بخط نسخي، الأخبار في الصدارة.',['#b3261e','#ffffff','#141414']],
  ['05','التطبيق','المهام أولاً، تبويبات وشريط سفلي يناسب الهاتف.',['#0e7490','#eef4f6','#0c2530']],
  ['06','بروتالي','حدود سميكة وأصفر صريح وظلال صلبة.',['#ffd400','#f2f2ee','#111111']],
  ['07','البوابة','شريط جانبي ثابت ولوحات محتوى، مناسب للحاسوب.',['#b45309','#f3f5f8','#0d253d']],
  ['08','الدافئ','طابع إنساني قريب، زوايا مدورة وشريط خدمات أفقي.',['#b8431c','#fbe9e2','#1f2933']],
  ['09','المؤسسي','شبكة صارمة وزوايا حادة مستوحاة من IBM Carbon.',['#0f62fe','#f4f4f4','#161616']],
  ['10','الأقرب إليك','محدد لجان السياقة هو الواجهة، والأخبار خط زمني.',['#14532d','#f4b740','#f3f6f2']],
  ['11','القائمة التفاعلية','قائمة تكشف الصور عند المرور عليها. من مكوّن Interactive List Preview.',['#171717','#f5f5f5','#a3a3a3']],
  ['12','اسأل الدائرة','اكتب سؤالك فتتحول الخانة إلى كرة تبحث ثم بطاقة جواب. من مكوّن AI Thinking Orb.',['#34d399','#151618','#0a0b0c']],
  ['13','المسارات','خطوط متحركة خلف العنوان وبطاقات تضيء تحت المؤشر.',['#047857','#fafafa','#171717']],
  ['14','الشاشة المائلة','شاشة تستقيم مع التمرير وفيها الأسعار والأدوية، مع خط زمني للأخبار.',['#be123c','#fafaf9','#1c1917']],
  ['15','الشفق','خلفية شفق متحركة وشريط أيقونات سفلي يكبر تحت المؤشر.',['#0f766e','#7dd3fc','#0f172a']]
];
const base = document.getElementById('base'), hint = document.getElementById('hint'), grid = document.getElementById('grid');
let saved = null; try { saved = localStorage.getItem('mpc_base'); } catch (e) {}
base.value = saved || new URL('.', location.href).href;
function draw() {
  let b = base.value.trim(); if (b && !b.endsWith('/')) b += '/';
  const local = /^(file:|https?:\/\/(localhost|127\.|\[::1\]))/.test(b);
  hint.className = local ? 'warn' : '';
  hint.textContent = local ? 'هذا رابط محلي يعمل على هذا الحاسوب فقط. الباركود لن يفتح على الهاتف حتى تُرفع الملفات إلى استضافة وتضع رابطها هنا.' : 'الباركودات تشير الآن إلى هذا الرابط.';
  grid.innerHTML = '';
  SITES.forEach(([n, name, desc, sw]) => {
    const url = b + 'site-' + n + '/';
    const c = document.createElement('article'); c.className = 'c';
    c.innerHTML = `<div><div class="sw">${sw.map(x => `<i style="background:${x}"></i>`).join('')}</div><h2>${n}. ${name}</h2><p>${desc}</p><a class="open" href="site-${n}/index.html">فتح التصميم</a></div><div class="qr"><div></div><span></span></div>`;
    c.querySelector('.qr span').textContent = url.replace(/^https?:\/\//, '');
    grid.appendChild(c);
    if (window.QRCode) new QRCode(c.querySelector('.qr div'), { text: url, width: 232, height: 232, correctLevel: QRCode.CorrectLevel.M });
    else c.querySelector('.qr div').textContent = 'تعذر تحميل مكتبة الباركود';
  });
}
document.getElementById('apply').addEventListener('click', () => { try { localStorage.setItem('mpc_base', base.value.trim()); } catch (e) {} draw(); });
draw();
</script>
</body>
</html>
