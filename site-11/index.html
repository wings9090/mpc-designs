<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دائرة العيادات الطبية الشعبية | القائمة التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* 11 القائمة التفاعلية: إعادة كتابة بـ JavaScript عادي لمكوّن Interactive List Preview (21st.dev / Hyperiux) */
:root{--bg:#171717;--surface:#1f1f1f;--ink:#f5f5f5;--muted:#a3a3a3;--line:#2e2e2e;--line-strong:#525252;--accent:#f5f5f5;--accent-ink:#171717;--radius:4px;--ok:#6ee7a8;--warn:#fbbf24;--bad:#f87171;--font:'Rubik',system-ui,sans-serif}
header .wrap{display:flex;align-items:center;gap:1.5rem;height:68px;font-size:.9rem}
header b{font-weight:500}header nav{display:flex;gap:1.3rem;margin-inline-start:auto;color:var(--muted)}
header a{text-decoration:none}header a:hover{color:var(--ink)}
.hero{padding-block:4rem 3rem;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,4rem);font-weight:300;max-width:20ch;margin-inline:auto}
.hero p{color:var(--muted);margin:1rem auto 2rem;max-width:52ch}
.hero .a{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.cap{color:var(--muted);font-size:.85rem;padding:0 24px .8rem;display:flex;justify-content:space-between}
/* المكوّن */
.ilp{position:relative;overflow:hidden;border-block:1px solid var(--line)}
.ilp .hl{position:absolute;inset-inline:0;top:0;height:0;background:#fff;opacity:0;z-index:1;pointer-events:none}
.ilp .imgs{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:difference}
.ilp .imgs div{position:absolute;left:28%;top:50%;width:19.5rem;height:22.5rem;margin-top:-11.25rem;visibility:hidden;will-change:clip-path,opacity}
.ilp .imgs img{width:100%;height:100%;object-fit:cover}
.ilp .row{position:relative;z-index:3;display:grid;grid-template-columns:1.2fr .8fr 2fr;gap:1rem;padding:1.05rem 24px;color:#fff;text-decoration:none;cursor:default;font-size:1.05rem}
.ilp a.row{cursor:pointer}
.ilp .row span:nth-child(2){color:inherit;opacity:.7;font-size:.9rem}
.ilp .row span:nth-child(3){font-size:.92rem;opacity:.85}
.ilp.touch .imgs,.ilp.touch .hl{display:none}
.ilp.touch .row{grid-template-columns:1fr 110px;border-bottom:1px solid var(--line);align-items:center}
.ilp.touch .row span:nth-child(2),.ilp.touch .row span:nth-child(3){grid-column:1;font-size:.85rem}
.ilp.touch .row img{grid-column:2;grid-row:1/4;width:110px;height:130px;object-fit:cover}
.ilp:not(.touch) .row img{display:none}
.sec{padding-block:4rem;border-bottom:1px solid var(--line)}
.sec h2{font-size:1.9rem;font-weight:300;margin-bottom:1.5rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.m-chip[aria-pressed="true"]{background:#fff;color:#171717;border-color:#fff}
.m-card,.m-step,.m-committee{background:none}
footer{padding-block:2rem;color:var(--muted);font-size:.88rem}
@media (max-width:860px){header nav{display:none}.duo{grid-template-columns:1fr}.sec{padding-block:2.5rem}.hero{padding-block:2.5rem 2rem}}
</style>
</head>
<body>
<header><div class="wrap"><b data-org="name"></b><nav><a href="#services">الخدمات</a><a href="#driving">فحص السياقة</a><a href="#prices">الأسعار والأدوية</a><a href="#clinics">العيادات</a><a href="#news">الأخبار</a></nav></div></header>
<section class="hero wrap">
  <h1 data-org="tagline"></h1>
  <p data-org="intro"></p>
  <div class="a" data-mpc="actions"></div>
</section>

<div class="cap"><span>الخدمات النوعية</span><span>مرّر المؤشر على القائمة</span></div>
<section class="ilp" id="services" data-list="services"></section>

<section class="sec" id="driving"><div class="wrap"><h2>لجان فحص السياقة</h2><div data-mpc="committees"></div></div></section>
<section class="sec" id="prices"><div class="wrap duo"><div><h2>أسعار الخدمات</h2><div data-mpc="prices"></div></div><div><h2>توفر الأدوية</h2><div data-mpc="meds"></div></div></div></section>

<div class="cap" style="padding-top:3rem" id="news"><span>أخبار وإعلانات</span><span>اضغط لفتح الخبر</span></div>
<section class="ilp" data-list="news"></section>

<section class="sec" id="clinics"><div class="wrap"><h2>دليل العيادات</h2><div data-mpc="clinics"></div></div></section>
<section class="sec"><div class="wrap duo"><div><h2>علاجك الشهري</h2><div data-mpc="steps" style="--gap:10px"></div></div><div><h2>أسئلة شائعة</h2><div data-mpc="faq"></div></div></div></section>
<section class="sec" id="jobs"><div class="wrap"><h2>فرص العمل</h2><div data-mpc="jobs"></div></div></section>
<section class="sec"><div class="wrap"><h2>خدمات إضافية</h2><div data-mpc="extras"></div></div></section>
<footer class="wrap"><span data-org="law"></span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../shared/data.js"></script><script src="../shared/app.js"></script>
<script>
(function () {
  const D = window.MPC, P = 'https://www.mpc.gov.iq/upload/';
  const pics = ['headlinepic2/ar/2.jpg', 'headlinepic/ar/65.jpg', 'headlinepic/ar/66.jpg', 'headlinepic/ar/67.jpg', 'headlinepic/ar/68.jpg', 'headlinepic/ar/69.jpg', 'imageblocks/ar/15.jpg', 'imageblocks/ar/14.jpg'].map(x => P + x);
  const LISTS = {
    services: D.services.map((s, i) => ({ a: s.title, b: s.tag || 'خدمة', c: s.text, img: pics[i % pics.length] })),
    news: D.news.map((n, i) => ({ a: n.title, b: new Date(n.date).toLocaleDateString('ar-IQ', { year: 'numeric', month: 'short' }), c: n.type, img: n.img || pics[i % pics.length], href: D.org.oldSite + 'index.php?name=News&file=article&sid=' + n.sid }))
  };
  const touch = matchMedia('(pointer: coarse)').matches || !window.gsap;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HID = 'inset(50%)', VIS = 'inset(0%)';

  document.querySelectorAll('.ilp').forEach(root => {
    const items = LISTS[root.dataset.list];
    const tag = it => it.href ? `a href="${it.href}" target="_blank" rel="noopener"` : 'div';
    root.innerHTML = `<div class="hl"></div><div class="imgs">${items.map(it => `<div><img src="${it.img}" alt="" onerror="this.parentNode.style.background='#444';this.remove()"></div>`).join('')}</div>`
      + items.map(it => `<${tag(it)} class="row"><span>${it.a}</span><span>${it.b}</span><span>${it.c}</span><img src="${it.img}" alt="" loading="lazy" onerror="this.remove()"></${it.href ? 'a' : 'div'}>`).join('');
    if (touch) { root.classList.add('touch'); return; }

    const hl = root.querySelector('.hl'), box = root.querySelector('.imgs');
    const imgs = [...box.children], rows = [...root.querySelectorAll('.row')];
    let z = 10, active = null;
    const gen = [], pending = [];
    const target = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
    gsap.set(imgs, { clipPath: reduce ? VIS : HID, opacity: reduce ? 0 : 1 });

    const color = (i, c) => gsap.to(rows[i], { color: c, duration: .35, ease: 'power2.out', overwrite: 'auto' });
    const out = i => {
      const el = imgs[i], g = gen[i] = (gen[i] || 0) + 1;
      gsap.killTweensOf(el);
      gsap.to(el, { ...(reduce ? {} : { clipPath: HID }), opacity: 0, duration: reduce ? .3 : .6, ease: 'power3.inOut', onComplete: () => { if (gen[i] === g) gsap.set(el, { visibility: 'hidden' }); } });
    };
    rows.forEach((row, i) => {
      row.addEventListener('mouseenter', () => {
        const el = imgs[i], g = gen[i] = (gen[i] || 0) + 1;
        pending[i] = false;
        if (reduce && active !== null && active !== i) out(active);
        gsap.killTweensOf(el);
        gsap.set(el, { zIndex: ++z, visibility: 'visible', clipPath: reduce ? VIS : HID, opacity: reduce ? 0 : 1 });
        gsap.to(el, { clipPath: VIS, opacity: 1, duration: reduce ? .3 : .6, ease: 'power2.inOut', onComplete: () => { if (gen[i] === g && pending[i]) { pending[i] = false; out(i); } } });
        if (active !== null && active !== i) color(active, '#fff');
        active = i; color(i, '#000');
        const tb = root.getBoundingClientRect(), rb = row.getBoundingClientRect();
        gsap.to(hl, { y: rb.top - tb.top, height: rb.height, opacity: 1, duration: .35, ease: 'power3.out', overwrite: 'auto' });
      });
      row.addEventListener('mouseleave', () => { if (gsap.isTweening(imgs[i])) pending[i] = true; else out(i); });
    });
    root.addEventListener('mouseleave', () => {
      if (active !== null) { color(active, '#fff'); active = null; }
      gsap.to(hl, { opacity: 0, duration: .35, overwrite: 'auto' });
      target.x = target.y = 0;
    });
    if (!reduce) {
      root.addEventListener('mousemove', e => {
        const b = root.getBoundingClientRect();
        target.x = ((e.clientX - b.left) / b.width - .5) * 20;
        target.y = ((e.clientY - b.top) / b.height - .5) * 20;
      });
      gsap.ticker.add(() => { cur.x += (target.x - cur.x) * .18; cur.y += (target.y - cur.y) * .18; gsap.set(box, { x: cur.x, y: cur.y }); });
    }
  });
})();
</script>
</body>
</html>
