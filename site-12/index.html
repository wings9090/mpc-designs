<style>
/* 12 اسأل الدائرة: إعادة كتابة بـ JavaScript عادي لمكوّن AI Thinking Orb and Input (21st.dev).
   البحث هنا مطابقة كلمات في بيانات الموقع وليس ذكاءً اصطناعياً. */
@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--bg:#0a0b0c;--surface:#151618;--ink:#f2f2f2;--muted:#9aa0a6;--line:#2a2c2f;--line-strong:#4a4d52;--accent:#34d399;--accent-ink:#06241a;--radius:16px;--radius-btn:99px;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--font:'Noto Sans Arabic',system-ui,sans-serif}
html,body{height:100%;overflow:hidden}
.proto-note{position:fixed;inset-inline:0;top:0}
.mo-root{position:fixed;inset:0;overflow:hidden}
.top{position:absolute;inset-inline:0;top:34px;display:flex;align-items:center;gap:.6rem;padding:14px 20px;z-index:5;flex-wrap:wrap}
.top b{margin-inline-end:auto;font-weight:600}
.intro{position:absolute;inset-inline:16px;top:22%;text-align:center;transition:opacity .3s,transform .3s}
.intro h1{font-size:clamp(1.8rem,5vw,3.4rem);font-weight:800}
.intro p{color:var(--muted);margin:.7rem auto 1.4rem;max-width:46ch}
.chips{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;max-width:720px;margin-inline:auto}
.chips button{padding:.5rem 1rem;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.92rem}
.chips button:hover{border-color:var(--accent)}
.mo-root:not([data-phase="idle"]) .intro{opacity:0;transform:translateY(-10px);pointer-events:none}
.mo-halo{position:absolute;left:50%;top:46%;width:560px;height:560px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgb(52 211 153 / .28),transparent);opacity:var(--oCenter,0);pointer-events:none}
.mo-mover{position:absolute;left:50%;top:46%;width:0;height:0;will-change:transform;direction:rtl}
.mo-trail{position:absolute;left:0;top:0;width:100px;height:100px;border-radius:50%;background:#e9e9e9;opacity:0;pointer-events:none}
.mo-actor{position:absolute;left:0;top:0;width:var(--w);height:var(--h);border-radius:var(--r);transform:translate(-50%,-50%)}
.mo-actor>*{position:absolute;inset:0;border-radius:inherit}
.mo-underglow{inset:10px 30px -16px;background:rgb(52 211 153 / .45);filter:blur(30px);opacity:calc(var(--oGlow)*.5)}
.mo-halo-green{inset:-46px;background:radial-gradient(closest-side,rgb(52 211 153 / .55),transparent);opacity:var(--oHalo);transform:scale(var(--bloom))}
.mo-surface{background:#17181a;border:1px solid var(--line);opacity:var(--oPill);overflow:hidden}
.mo-aurora{position:absolute;inset:0;opacity:calc(var(--oAur)*.55);filter:blur(22px)}
.mo-aurora i{position:absolute;top:-40%;width:40%;height:180%;border-radius:50%;animation:mo-drift 7s ease-in-out infinite alternate}
.mo-aurora i:nth-child(1){left:0;background:rgb(52 211 153 / .28)}
.mo-aurora i:nth-child(2){left:30%;background:rgb(56 189 248 / .18);animation-duration:9s}
.mo-aurora i:nth-child(3){left:60%;background:rgb(52 211 153 / .2);animation-duration:11s}
.mo-ball{background:radial-gradient(circle at 35% 30%,#fff,#d4d4d4 60%,#9a9a9a);opacity:var(--oBall)}
.mo-green{background:radial-gradient(circle at 35% 30%,#8ff5cb,#34d399 60%,#10956a);opacity:var(--oGreen);transform:scale(var(--gs))}
.mo-card{background:var(--surface);border:1px solid var(--line);opacity:var(--oCard);transform:scale(var(--cs))}
.mo-ring{padding:1px;background:conic-gradient(from var(--angle),transparent 55%,#34d399,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:var(--oRing);animation:mo-spin 4s linear infinite;pointer-events:none}
.mo-actor[data-typing] .mo-ring{animation-duration:1.4s}
.mo-actor[data-flash] .mo-surface{border-color:var(--bad)}
.mo-actor[data-shake]{animation:mo-shake .26s}
.mo-input{display:flex;align-items:center;gap:.6rem;padding-inline:18px 10px;opacity:var(--oInput);transform:scale(var(--inScale))}
.mo-input[inert]{pointer-events:none}
.mo-input>i{font-size:1.3rem;color:var(--accent)}
.mo-field{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1.02rem}
.mo-field::placeholder{color:var(--muted)}
.mo-send{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:#2a2c2f;color:#8a8f96;cursor:pointer;font-size:1.2rem;display:grid;place-items:center;transition:background .2s,color .2s}
.mo-send[data-ready]{background:var(--accent);color:var(--accent-ink)}
canvas.mo-orb{inset:auto;left:50%;top:50%;width:220px;height:220px;transform:translate(-50%,-50%);border-radius:0;pointer-events:none}
.mo-pulse{inset:auto;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border:2px solid #34d399;border-radius:50%;opacity:0;pointer-events:none}
.mo-answer{padding:18px 22px;opacity:var(--oCard);overflow:hidden;outline:0;pointer-events:none}
.mo-a-head{display:flex;gap:.5rem;align-items:center;font-size:.82rem;color:var(--muted);opacity:var(--hOp)}
.mo-a-dot{width:8px;height:8px;border-radius:50%;background:#34d399;transform:scale(var(--dotS))}
.mo-a-body{margin-top:.5rem;font-size:1.04rem;line-height:1.75}
.mo-w{display:inline-block;opacity:0}
.mo-status{position:absolute;inset-inline:0;top:calc(46% + 96px);height:26px;text-align:center;color:var(--muted);opacity:var(--sOp,0);transform:translateY(calc(var(--sTy,6)*1px));pointer-events:none}
.mo-lab{position:absolute;inset-inline:0}
.mo-in{animation:mo-in .3s both}.mo-out{animation:mo-out .25s both}
.mo-lab.done{color:#34d399}
.mo-dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;margin:0 2px;animation:mo-dot 1.2s infinite}
.mo-dots i:nth-child(2){animation-delay:.2s}.mo-dots i:nth-child(3){animation-delay:.4s}
.after{position:absolute;inset-inline:0;top:calc(46% + 100px);display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;opacity:0;pointer-events:none;transition:opacity .3s}
.mo-root[data-phase="answered"] .after{opacity:1;pointer-events:auto}
.hint{position:absolute;inset-inline:0;bottom:22px;text-align:center;color:var(--muted);font-size:.78rem;padding-inline:16px}
.mo-root:not([data-phase="idle"]) .hint{opacity:0}
@keyframes mo-spin{to{--angle:360deg}}
@keyframes mo-drift{from{transform:translateX(-14%)}to{transform:translateX(14%)}}
@keyframes mo-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes mo-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mo-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-6px)}}
@keyframes mo-shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 4px),-50%)}75%{transform:translate(calc(-50% + 4px),-50%)}}
@media (max-width:640px){.top .m-btn span{display:none}.intro{top:20%}}
@media (max-height:620px){.intro p{display:none}.intro{top:16%}}
</style>

<script>
/* ───────── الإجابة: مطابقة كلمات في بيانات الموقع ───────── */
function mpcAnswer(q) {
  const D = window.MPC, n = s => s.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
  const t = n(q), has = (...w) => w.some(x => t.includes(n(x)));
  const num = v => Number(v).toLocaleString('ar-IQ');
  const sec = (name, title, label) => `<button class="m-btn sm" data-open="sec" data-sec="${name}" data-title="${title}">${label}</button>`;
  const med = D.meds.items.find(m => n(m.name).split(' ').some(w => w.length > 3 && t.includes(w)) || t.includes(m.en.toLowerCase()));
  if (med) return [`${med.name} حالته الآن: ${med.status}. هذه بيانات توضيحية وليست رصيداً فعلياً.`, sec('meds', 'توفر الأدوية', 'كل الأدوية')];
  let best = null, bs = 0;
  for (const g of D.prices.groups) for (const r of g.rows) {
    const sc = n(r[0]).split(' ').filter(x => x.length > 2 && !['طبيب', 'فحص', 'كشف'].includes(x)).filter(x => t.includes(x)).length;
    if (sc > bs) { bs = sc; best = r; }
  }
  if (best) return [`${best[0]}: ${num(best[1])} دينار. هذا سعر توضيحي وليس التسعيرة الرسمية.`, sec('prices', 'أسعار الخدمات', 'كل الأسعار')];
  for (const [g, list] of Object.entries(D.clinics)) {
    const c = list.find(x => n(x).split(' ').some(w => w.length > 3 && t.includes(w)));
    if (c) return [`نعم، توجد عيادة ${c} الطبية الشعبية ضمن ${g}.`, sec('clinics', 'دليل العيادات', 'دليل العيادات')];
  }
  if (has('سياق', 'لجن', 'اجازه', 'سوق', 'مرور')) return ['في بغداد ست لجان: الإسكان والبياع وإسماعيل ناجي في الكرخ، وفخري الدين آل جميل والصليخ والصدر الأولى في الرصافة. الحجز عبر بوابة أور.', '<button class="m-btn sm" data-open="nearest">رتّبها حسب موقعي</button>'];
  if (has('شكو', 'اشتك', 'مشكل')) return ['تستطيع تقديم الشكوى الآن وتحصل على رقم مرجعي لمتابعتها.', '<button class="m-btn sm" data-open="complaint">تقديم شكوى</button>'];
  if (has('مدير', 'مقابل', 'موعد')) return ['تستطيع طلب مقابلة المدير العام من هنا، ومكتبه يحدد الموعد النهائي.', '<button class="m-btn sm" data-open="meeting">طلب مقابلة</button>'];
  if (has('مختبر', 'تحليل', 'تحاليل')) return ['المختبر الاستشاري في بغداد، القادسية، قرب مستشفى اليرموك مقابل باب الطوارئ. من 9 صباحاً إلى 8 مساءً عدا الجمعة.', sec('prices', 'أسعار الخدمات', 'أسعار التحاليل')];
  if (has('وظيف', 'تعيين', 'تشغيل', 'عمل')) return ['توجد إعلانات تشغيل في الشرقاط وديالى والديوانية والنجف وكربلاء. المراجعة خلال 5 أيام من النشر.', sec('jobs', 'فرص العمل', 'عرض الإعلانات')];
  if (has('دواء', 'ادوي', 'علاج', 'مزمن', 'ضغط', 'سكر')) return ['أدوية الأمراض المزمنة تُصرف شهرياً من صيدلية العيادة بموجب دفتر الأمراض المزمنة.', sec('meds', 'توفر الأدوية', 'توفر الأدوية')];
  if (has('سعر', 'اسعار', 'اجور', 'كم', 'بكم')) return ['الأسعار مقسمة على العيادات والأسنان والمختبر والأجنحة الخاصة ولجان السياقة.', sec('prices', 'أسعار الخدمات', 'عرض الأسعار')];
  if (has('عياد', 'اقرب', 'وين', 'اين')) return ['في الدليل 69 عيادة في بغداد وكربلاء والنجف. اكتب اسم منطقتك للبحث.', sec('clinics', 'دليل العيادات', 'دليل العيادات')];
  if (has('خبر', 'اخبار', 'اعلان')) return ['آخر ما نُشر: إعلانات تشغيل في عدة محافظات، ومشاركة الدائرة في دورة إعداد القوائم المالية.', sec('news', 'أخبار وإعلانات', 'كل الأخبار')];
  return ['لم أجد جواباً محدداً. جرّب كلمات مثل: دواء، سعر، عيادة، لجنة سياقة، شكوى.', sec('services', 'الخدمات النوعية', 'تصفح الخدمات')];
}

/* ───────── المحرك: منقول من مكوّن MorphOrb ───────── */
(function () {
  const PILL_H = 60, BALL = 60, ORB_D = 132, ORB_R = 66, CANVAS = 220, CARD_H = 156, FLY_D = 138, MIN_THINK = 2300;
  const LABELS = ['أبحث', 'أراجع البيانات', 'أطابق سؤالك', 'أكتب الجواب'], DONE = 'تم';
  const pillW = () => Math.min(600, innerWidth - 32), cardW = () => Math.min(480, innerWidth - 32), homeDy = () => innerHeight * 0.54 - 96;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v, lerp = (a, b, t) => a + (b - a) * t, f4 = v => String(Math.round(v * 1e4) / 1e4), TAU = Math.PI * 2;
  function cb(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
    return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x; for (let i = 0; i < 30; i++) { const e = sx(t); if (Math.abs(e - x) < 1e-5) break; if (x > e) lo = t; else hi = t; t = (lo + hi) / 2; } return sy(t); };
  }
  const E = { out: cb(.22, 1, .36, 1), io: cb(.65, 0, .35, 1), in: cb(.4, 0, 1, 1), fly: cb(.5, 0, .1, 1), grow: cb(.3, 0, .2, 1), vortex: cb(.6, 0, .2, 1), spring: cb(.34, 1.4, .64, 1), card: cb(.65, 0, .2, 1), lin: t => t };
  const bez = (t, p0, c, p2) => (1 - t) * (1 - t) * p0 + 2 * (1 - t) * t * c + t * t * p2;
  const T = (ch, from, to, t0, t1, ease) => ({ ch, from, to, t0, t1, ease: ease || E.io });

  const launch = g => [
    T('w', g.pw, g.pw - 12, 0, 100, E.out), T('oInput', 1, 0, 0, 160, E.in), T('inScale', 1, .6, 0, 160, E.in), T('oGlow', 1, 0, 0, 300, E.out), T('oAur', 1, 0, 0, 300, E.out),
    T('w', g.pw - 12, BALL, 100, 560), T('h', PILL_H, PILL_H + 6, 380, 500, E.out), T('h', PILL_H + 6, BALL, 500, 620, E.out), T('oPill', 1, 0, 300, 560, E.out), T('oBall', 0, 1, 300, 560, E.out),
    T('u', 0, 1, 620, 1500, E.fly), T('w', BALL, FLY_D, 620, 1300, E.grow), T('h', BALL, FLY_D, 620, 1300, E.grow), T('w', FLY_D, ORB_D, 1300, 1500, E.out), T('h', FLY_D, ORB_D, 1300, 1500, E.out),
    T('cHalo', 0, .6, 620, 1500, E.out), T('trail', 0, 1, 700, 800, E.out), T('trail', 1, 0, 1300, 1500, E.in)];
  const ASSEMBLE = [T('oRing', 1, 0, 0, 300, E.out), T('oBall', 1, 0, 0, 260, E.out), T('orb.k', 0, 1, 0, 800, E.out), T('orb.alpha', 0, 1, 0, 800, E.out), T('orb.spin', 0, .9, 0, 800, E.out), T('orb.pop', 1, 1.05, 0, 420, E.out), T('orb.pop', 1.05, 1, 420, 800), T('sOp', 0, 1, 300, 620, E.out), T('sTy', 6, 0, 300, 620, E.out)];
  const RESOLVE = [T('orb.sweep', 0, 1, 0, 700), T('orb.spin', .9, .3, 0, 700, E.out), T('orb.gain', 1, 0, 0, 700, E.out), T('orb.floor', 0, .95, 400, 900, E.out), T('orb.rad', 0, .15, 400, 900, E.out), T('orb.pop', 1, 1.04, 600, 800, E.out), T('orb.pop', 1.04, 1, 800, 900, E.out)];
  const CONDENSE = [T('orb.pop', 1, 1.06, 0, 120, E.out), T('sOp', 1, 0, 0, 160, E.in), T('sTy', 0, -6, 0, 160, E.in), T('orb.k', 1, 0, 120, 640, E.vortex), T('orb.vortex', 0, 1.6, 120, 640, E.vortex), T('oGreen', 0, 1, 260, 700, E.spring), T('gs', .55, 1, 260, 700, E.spring), T('pulse', 0, 1, 320, 760, E.out), T('oHalo', 0, .35, 380, 700, E.out), T('orb.alpha', 1, 0, 500, 800, E.out)];
  const unfold = (g, tw) => [T('w', ORB_D, 124, 0, 90, E.in), T('h', ORB_D, 124, 0, 90, E.in), T('w', 124, g.cw, 90, 700, E.card), T('h', 124, CARD_H, 90, 700, E.out), T('r', ORB_D / 2, 20, 90, 700), T('oGreen', 1, 0, 200, 560, E.out), T('oCard', 0, 1, 200, 560, E.out), T('oHalo', .35, 0, 300, 700, E.out), T('cHalo', .6, .22, 300, 700, E.out), T('hOp', 0, 1, 520, 840, E.out), T('dotS', 0, 1, 520, 840, E.spring), T('wp', 0, 1, 600, 600 + tw, E.lin), T('bloom', 1, .625, 700, 1200)];
  const FADE = ['oGlow', 'oAur', 'oPill', 'oBall', 'oGreen', 'oCard', 'oRing', 'oInput', 'oHalo', 'sOp', 'orb.alpha', 'trail'];
  const INIT = { h: PILL_H, r: 999, oGlow: 1, oHalo: 0, oPill: 1, oBall: 0, oGreen: 0, oCard: 0, oRing: 1, oInput: 1, inScale: 1, oAur: 1, gs: .55, cs: 1, hOp: 0, dotS: 0, bloom: 1, u: 0, yOff: 0, trail: 0, pulse: -1, sOp: 0, sTy: 6, cHalo: 0, wp: 0, 'orb.k': 0, 'orb.alpha': 0, 'orb.spin': 0, 'orb.pop': 1, 'orb.sweep': 0, 'orb.vortex': 0, 'orb.gain': 1, 'orb.floor': 0, 'orb.rad': 0 };

  const $ = s => document.querySelector(s);
  const root = $('.mo-root'), mover = $('.mo-mover'), actor = $('.mo-actor'), form = $('.mo-input'), input = $('.mo-field'), send = $('.mo-send');
  const canvas = $('.mo-orb'), pulse = $('.mo-pulse'), status = $('.mo-status'), body = $('.mo-a-body'), ansEl = $('.mo-answer'), live = $('#live'), act = $('#act');
  const ghosts = [...document.querySelectorAll('.mo-trail')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── الكرة المنقّطة ── */
  const orb = (function () {
    let s = 7; const rand = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const dots = [];
    for (let k = 0; k < 16; k++) { const y = 1 - ((k + .5) / 16) * 2, r = Math.sqrt(1 - y * y), m = Math.max(4, Math.round(30 * r)); for (let j = 0; j < m; j++) { const a = (j / m) * TAU + k * .35; dots.push([Math.cos(a) * r, y, Math.sin(a) * r, (1 - y) / 2, rand() * 6.283]); } }
    const N = dots.length, GS = 24, AS = 48, COLORS = [];
    for (let gi = 0; gi <= GS; gi++) { const g = gi / GS, r = Math.round(lerp(235, 52, g)), gg = Math.round(lerp(235, 211, g)), b = Math.round(lerp(235, 153, g)); for (let ai = 0; ai <= AS; ai++) COLORS.push(`rgba(${r},${gg},${b},${(ai / AS).toFixed(3)})`); }
    const P = {}, lit = new Float32Array(N), SX = new Float32Array(N), SY = new Float32Array(N), SR = new Float32Array(N), SD = new Float32Array(N), SC = new Int16Array(N), pw = [1, 0, 0, 0];
    const ctx = canvas.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = canvas.height = Math.round(CANVAS * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let time = 0, raf = 0, last = 0;
    const reset = () => { Object.assign(P, { k: 0, alpha: 0, spin: 0, rot: 0, sweep: 0, pop: 1, vortex: 0, gain: 1, floor: 0, rad: 0, prog: 0 }); lit.fill(0); pw[0] = 1; pw[1] = pw[2] = pw[3] = 0; time = 0; };
    reset();
    const S = .6, CP = Math.cos(.35), SP = Math.sin(.35), C0 = CANVAS / 2;
    function draw(dt) {
      ctx.clearRect(0, 0, CANVAS, CANVAS); time += dt; P.rot += P.spin * dt;
      const yaw = P.rot + P.vortex, cyw = Math.cos(yaw), syw = Math.sin(yaw), stepW = dt / .35;
      for (let q = 0; q < 4; q++) { const d = (q === P.prog ? 1 : 0) - pw[q]; pw[q] += Math.abs(d) <= stepW ? d : d > 0 ? stepW : -stepW; }
      const decay = Math.exp(-dt / .5), h0 = (time * 300) % N, h3 = (time * 480) % N;
      const a1 = time * .8, b1 = Math.sin(time * .5) * .9, f1x = Math.cos(b1) * Math.cos(a1), f1y = Math.sin(b1), f1z = Math.cos(b1) * Math.sin(a1);
      const a2 = time * .55 + 2.1, b2 = Math.cos(time * .42) * .9, f2x = Math.cos(b2) * Math.cos(a2), f2y = Math.sin(b2), f2z = Math.cos(b2) * Math.sin(a2);

      for (let n = 0; n < N; n++) {

        let pl = 0, v, dd;
        if (pw[0] > .001) { dd = Math.abs(n - h0); if (dd > N - dd) dd = N - dd; v = Math.max(0, 1 - dd / 16); pl = Math.max(pl, v * v * pw[0]); }
        if (pw[1] > .001) { v = Math.max(Math.max(0, (dx * f1x + dy * f1y + dz * f1z - .72) / .28), Math.max(0, (dx * f2x + dy * f2y + dz * f2z - .72) / .28)); pl = Math.max(pl, v * v * pw[1]); }
        if (pw[2] > .001) { const e = dy - lat; v = Math.max(0, 1 - (e * e) / .02); pl = Math.max(pl, v * v * pw[2]); }
        if (pw[3] > .001) { dd = Math.abs(n - h3); if (dd > N - dd) dd = N - dd; v = Math.max(0, 1 - dd / 22); pl = Math.max(pl, v * v * pw[3]); }
        const l = Math.max(lit[n] * decay, pl * P.gain); lit[n] = l;
        const ki = clamp01(P.k * (1 + S) - S * u);
        if (ki <= .001) { SC[n] = -1; continue; }
        const eo = E.out(ki), kk = eo * P.pop;
        const x1 = dx * cyw + dz * syw, z1 = -dx * syw + dz * cyw, y2 = dy * CP - z1 * SP, z2 = dy * SP + z1 * CP, f = 2.8 / (2.8 - z2), depth = (z2 + 1) / 2;
        let ox = x1 * ORB_R * kk * f, oy = -y2 * ORB_R * kk * f;
        if (swirlK > .001) { const sw = (1 - ki) * swirlK, cc = Math.cos(sw), ss = Math.sin(sw), tx = ox * cc - oy * ss; oy = ox * ss + oy * cc; ox = tx; }
        const g = clamp01((P.sweep * 1.4 - u) / .4);
        let a = .1 + .035 * Math.sin(d[4] + time * 1.6) * (1 - g) + .32 * depth * depth + .75 * l * (1 - g) + g * (.55 + .4 * depth) + 2 * g * (1 - g);
        a = Math.max(a, P.floor * (.7 + .3 * depth)); if (a > 1) a = 1; a *= eo * P.alpha;
        SX[n] = C0 + ox; SY[n] = C0 + oy; SD[n] = depth;
        SR[n] = (1.15 * (.45 + .75 * depth) * f + .9 * l + g * .25) * (1 + P.rad) * (.4 + .6 * eo);
        const ai = Math.round(a * AS), gi = Math.round(g * GS);
        SC[n] = ai <= 0 ? -1 : gi * (AS + 1) + ai;
      }
      for (let pass = 0; pass < 2; pass++) for (let n = 0; n < N; n++) { const c = SC[n]; if (c < 0 || (SD[n] >= .5) !== (pass === 1)) continue; ctx.fillStyle = COLORS[c]; ctx.beginPath(); ctx.arc(SX[n], SY[n], SR[n], 0, TAU); ctx.fill(); }
    }
    function frame(now) { raf = 0; const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; draw(dt); if (P.alpha > .002) raf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, CANVAS, CANVAS); }
    const ensure = () => { if (raf || P.alpha <= .002) return; last = performance.now(); raf = requestAnimationFrame(frame); };
    return { P, ensure, reset };
  })();

  /* ── القنوات ── */
  const geo = { pw: pillW(), cw: cardW(), H: homeDy(), dir: -1 }, vals = {}, dirty = new Set(), CH = {}, hist = [];
  let curX = 0, curY = 0, curD = BALL, trailVis = 0, wStagger = 45, wDur = 320, busy = false, idling = false, epoch = 0, ctl = null;
  function sampleAt(t) { const n = hist.length; if (!n) return { x: 0, y: 0, d: 0 }; if (t <= hist[0].t) return hist[0]; for (let i = n - 1; i > 0; i--) { const a = hist[i - 1], b = hist[i]; if (t >= a.t) { if (t >= b.t) return b; const k = (t - a.t) / (b.t - a.t || 1); return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), d: lerp(a.d, b.d, k) }; } } return hist[n - 1]; }
  function renderTrail() {
    if (trailVis <= .001) { ghosts.forEach(g => g.style.opacity = '0'); return; }
    const now = performance.now();
    ghosts.forEach((g, i) => { const s = sampleAt(now - (i + 1) * 45), k = (s.d * (1 - .08 * (i + 1))) / 100; g.style.transform = `translate3d(${(s.x - curX).toFixed(2)}px,${(s.y - curY).toFixed(2)}px,0) translate(-50%,-50%) scale(${k.toFixed(3)})`; g.style.opacity = (.28 * Math.pow(1 - i / 6, 1.5) * trailVis).toFixed(3); });
  }
  function applyPath() {
    const u = vals.u || 0, H = geo.H;
    curX = bez(u, 0, geo.dir * .3 * H, 0); curY = bez(u, H, .6 * H, 0) + (vals.yOff || 0);
    mover.style.transform = `translate3d(${curX.toFixed(2)}px,${curY.toFixed(2)}px,0)`;
    const now = performance.now(); hist.push({ t: now, x: curX, y: curY, d: curD }); while (hist.length > 2 && hist[0].t < now - 500) hist.shift();
    renderTrail();
  }
  function applyWords(v) {
    const nodes = body.querySelectorAll('.mo-w'), time = v * ((nodes.length - 1) * wStagger + wDur);
    nodes.forEach((el, i) => { const p = E.out(clamp01((time - i * wStagger) / wDur)); el.style.opacity = f4(p); el.style.transform = p >= .999 ? 'none' : `translateY(${f4((1 - p) * 4)}px)`; el.style.filter = p >= .999 ? 'none' : `blur(${f4((1 - p) * 4)}px)`; });
  }
  ['oGlow', 'oHalo', 'oPill', 'oBall', 'oGreen', 'oCard', 'oRing', 'oInput', 'oAur', 'gs', 'cs', 'hOp', 'dotS', 'bloom'].forEach(n => CH[n] = v => actor.style.setProperty('--' + n, f4(v)));
  ['w', 'h', 'r'].forEach(n => CH[n] = v => { actor.style.setProperty('--' + n, f4(v) + 'px'); if (n === 'w') curD = v; });
  CH.inScale = v => { actor.style.setProperty('--inScale', f4(v)); form.style.filter = v >= .999 ? 'none' : `blur(${f4((1 - v) * 15)}px)`; };
  CH.sOp = v => status.style.setProperty('--sOp', f4(v)); CH.sTy = v => status.style.setProperty('--sTy', f4(v));
  CH.cHalo = v => root.style.setProperty('--oCenter', f4(v));
  CH.u = applyPath; CH.yOff = applyPath; CH.trail = v => { trailVis = v; renderTrail(); };
  CH.pulse = v => { if (v < 0) { pulse.style.opacity = '0'; return; } pulse.style.opacity = f4(.5 * (1 - v)); pulse.style.transform = `scale(${f4(1 + v)})`; };
  CH.wp = applyWords;
  ['k', 'alpha', 'spin', 'sweep', 'pop', 'vortex', 'gain', 'floor', 'rad'].forEach(n => CH['orb.' + n] = v => { orb.P[n] = v; if (n === 'alpha') orb.ensure(); });
  const setNow = (ch, v) => { vals[ch] = v; CH[ch](v); };
  const resetChannels = () => { setNow('w', geo.pw); for (const ch in INIT) setNow(ch, INIT[ch]); };
  const snapshot = () => { geo.pw = pillW(); geo.cw = cardW(); geo.H = homeDy(); };

  /* ── الخط الزمني ── */
  const play = (tracks, sig) => new Promise(res => {
    if (sig.aborted) return res();
    const end = tracks.reduce((m, k) => Math.max(m, k.t1), 0), done = new Set();
    let raf = 0, t = 0, last = performance.now();
    const onAbort = () => { cancelAnimationFrame(raf); res(); };
    const step = now => {
      t += Math.max(0, Math.min(100, now - last)); last = now;
      for (const k of tracks) { if (done.has(k) || t < k.t0) continue; const p = Math.min(1, (t - k.t0) / Math.max(1, k.t1 - k.t0)); vals[k.ch] = k.from + (k.to - k.from) * k.ease(p); dirty.add(k.ch); if (p === 1) done.add(k); }
      dirty.forEach(ch => CH[ch](vals[ch])); dirty.clear();
      if (t >= end) { sig.removeEventListener('abort', onAbort); res(); } else raf = requestAnimationFrame(step);
    };
    sig.addEventListener('abort', onAbort, { once: true }); raf = requestAnimationFrame(step);
  });
  const sleep = (ms, sig) => new Promise(res => { if (sig.aborted) return res(); const id = setTimeout(res, Math.max(0, ms)); sig.addEventListener('abort', () => { clearTimeout(id); res(); }, { once: true }); });

  /* ── الواجهة ── */
  const setPhase = p => root.dataset.phase = p;
  const labelHtml = name => name === DONE ? name : `${name}<span class="mo-dots"><i></i><i></i><i></i></span>`;
  function swapLabel(name) {
    const old = status.lastElementChild;
    if (old) { old.className = 'mo-lab mo-out'; setTimeout(() => old.remove(), 260); }
    const el = document.createElement('span'); el.className = 'mo-lab mo-in' + (name === DONE ? ' done' : ''); el.innerHTML = labelHtml(name); status.appendChild(el);
  }
  const setAnswer = text => { body.textContent = ''; text.split(/\s+/).filter(Boolean).forEach(w => { const s = document.createElement('span'); s.className = 'mo-w'; s.textContent = w; body.append(s, ' '); }); };

  async function run(text, sig) {
    const go = async tr => { await play(tr, sig); if (sig.aborted) throw 0; };
    try {
      const [answer, action] = mpcAnswer(text);
      const n = Math.max(1, answer.split(/\s+/).length);
      setPhase('launch'); hist.length = 0; status.textContent = ''; swapLabel(LABELS[0]);
      if (reduced) {
        setNow('u', 1); setNow('oInput', 0); setNow('oPill', 0); setNow('oRing', 0); setNow('oGlow', 0); setNow('sTy', 0); setNow('sOp', 1); setPhase('think');
        await sleep(900, sig); if (sig.aborted) throw 0;
        setAnswer(answer); act.innerHTML = action; wDur = 250; wStagger = 0;
        setNow('w', geo.cw); setNow('h', CARD_H); setNow('r', 20); setNow('sOp', 0); setNow('dotS', 1);
        await go([T('oCard', 0, 1, 0, 250, E.out), T('hOp', 0, 1, 0, 250, E.out), T('wp', 0, 1, 0, 250, E.lin)]);
      } else {
        await go(launch(geo)); setNow('r', ORB_D / 2);
        setPhase('assemble'); await go(ASSEMBLE);
        setPhase('think'); live.textContent = LABELS[0];
        const t0 = performance.now(); let i = 0;
        while (performance.now() - t0 < MIN_THINK) { await sleep(Math.min(750, MIN_THINK - (performance.now() - t0)), sig); if (sig.aborted) throw 0; if (performance.now() - t0 < MIN_THINK) { i = (i + 1) % LABELS.length; orb.P.prog = i % 4; swapLabel(LABELS[i]); } }
        setPhase('resolve'); swapLabel(DONE); await go(RESOLVE);
        setPhase('condense'); await go(CONDENSE);
        setPhase('unfold'); wDur = 320; wStagger = n > 1 ? Math.min(45, 420 / (n - 1)) : 0;
        setAnswer(answer); act.innerHTML = action;
        await go(unfold(geo, (n - 1) * wStagger + wDur));
      }
      setPhase('answered'); live.textContent = 'الجواب: ' + answer; ansEl.focus({ preventScroll: true });
    } catch (e) { if (e !== 0) hard(); }
  }
  async function toIdle(kind) {
    if (idling) return; idling = true; const my = ++epoch;
    if (ctl) ctl.abort(); ctl = new AbortController(); const sig = ctl.signal;
    setPhase('reset');
    const out = [T('cHalo', vals.cHalo || 0, 0, 0, 220, E.out)];
    FADE.forEach(ch => { if ((vals[ch] || 0) > .001) out.push(T(ch, vals[ch], 0, 0, 220, E.out)); });
    await play(out, sig); if (my !== epoch) return;
    finishIdle(kind === 'reset' ? 8 : 0);
    const pillCh = ['oPill', 'oInput', 'oGlow', 'oAur', 'oRing']; pillCh.forEach(ch => setNow(ch, 0));
    const inn = pillCh.map(ch => T(ch, 0, 1, 0, 380, E.out)); if (kind === 'reset') inn.push(T('yOff', 8, 0, 0, 380, E.out));
    await play(inn, sig); if (my !== epoch) return;
    resetChannels(); busy = idling = false; form.inert = false; setPhase('idle'); input.focus({ preventScroll: true });
  }
  function finishIdle(yOff) { setNow('pulse', -1); body.textContent = ''; act.innerHTML = ''; status.textContent = ''; input.value = ''; send.removeAttribute('data-ready'); orb.reset(); hist.length = 0; snapshot(); resetChannels(); setNow('yOff', yOff); }
  function hard() { epoch++; if (ctl) ctl.abort(); finishIdle(0); busy = idling = false; form.inert = false; setPhase('idle'); }
  function start(text) {
    if (busy) return; busy = true; snapshot(); geo.dir = -geo.dir; orb.reset(); setNow('u', 0);
    ctl = new AbortController(); form.inert = true; run(text, ctl.signal);
  }
  function shake() { actor.removeAttribute('data-shake'); void actor.offsetWidth; actor.setAttribute('data-shake', ''); actor.setAttribute('data-flash', ''); setTimeout(() => { actor.removeAttribute('data-shake'); actor.removeAttribute('data-flash'); }, 260); }

  let typing = 0;
  input.addEventListener('input', () => { send.toggleAttribute('data-ready', !!input.value.trim()); actor.setAttribute('data-typing', ''); clearTimeout(typing); typing = setTimeout(() => actor.removeAttribute('data-typing'), 300); });
  form.addEventListener('submit', e => { e.preventDefault(); const t = input.value.trim(); if (!t) return shake(); start(t); });
  document.querySelector('.chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !busy) { input.value = b.textContent; send.setAttribute('data-ready', ''); start(b.textContent); } });
  $('#again').addEventListener('click', () => { if (root.dataset.phase === 'answered') toIdle('reset'); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && busy && !idling && !document.querySelector('dialog[open]')) { e.preventDefault(); toIdle('esc'); } });
  addEventListener('resize', () => { if (!busy) { snapshot(); setNow('w', geo.pw); setNow('u', 0); } });
  resetChannels();
  input.focus({ preventScroll: true });
})();
</script>
